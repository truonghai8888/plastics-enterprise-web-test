name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production
        run: npm run build

      - name: Ensure 404.html and route entrypoints exist in dist
        run: |
          if [ -f "public/404.html" ]; then
            cp public/404.html dist/404.html
          elif [ -f "dist/index.html" ] && [ ! -f "dist/404.html" ]; then
            cp dist/index.html dist/404.html
          fi

          if [ -f "dist/index.html" ]; then
            for r in tu-thiet-ke-vach san-pham-chinh thu-vien-ma-mau bang-gia gioi-thieu; do
              mkdir -p "dist/$r"
              sed -e 's|\./assets/|\.\./assets/|g' -e 's|\./favicon|\.\./favicon|g' -e 's|\./apple-touch-icon|\.\./apple-touch-icon|g' dist/index.html > "dist/$r/index.html"
            done
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
