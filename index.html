<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23deaa26'><path d='M12 2C6.5 2 2 6.5 2 12c0 5 4 9 9.5 9.8 1-.8 1.8-2 2.2-3.4.4-1.4.3-3-.3-4.4a8.4 8.4 0 0 1 8.6-8c-.1 4.5-3.5 8-8 8'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhựa AMC - Nhà Máy Sản Xuất Gỗ Nhựa & Tấm Ốp Than Tre Hàng Đầu Việt Nam</title>
    <meta name="description" content="Nhựa AMC - Nhà máy sản xuất và phân phối tấm ốp than tre đa năng, lam sóng cao cấp đạt chuẩn an toàn formaldehyde E0 và chống cháy B1." />

    <!-- Google Fonts: Plus Jakarta Sans with Vietnamese Subsets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- SPA GitHub Pages Redirect Handler (Xử lý khi reload hoặc truy cập trực tiếp URL con) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- Tự động tương thích đường dẫn hình ảnh, video, scripts, styles khi chạy trên GitHub Pages subpath -->
    <script type="text/javascript">
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.includes('github.io')) {
          var knownRoutes = [
            'tu-thiet-ke-vach', 'san-pham-chinh', 'thu-vien-ma-mau', 'bang-gia',
            'tinh-chi-phi', 'cong-trinh', 'tai-catalogue', 'huong-dan-thi-cong',
            'tin-tuc', 'hoi-dap', 'gioi-thieu', 'chung-chi-chung-nhan',
            'chinh-sach-bao-hanh', 'lien-he', 'nhan-mau', 'san-pham',
            'chinh-sach-bao-mat', 'dieu-khoan', 'nha-phan-phoi', 'tam-than-tre-17mm'
          ];
          var parts = window.location.pathname.split('/').filter(Boolean);
          // Chỉ áp dụng repoBase nếu phần đầu tiên của path KHÔNG phải là một route (tức là Project Site: /repo-name/...)
          if (parts.length > 0 && knownRoutes.indexOf(parts[0]) === -1) {
            var repoBase = '/' + parts[0];
            var fixUrl = function(u) {
              if (typeof u === 'string') {
                if ((u.startsWith('/images/') || u.startsWith('/assets/') || u.startsWith('/videos/')) && !u.startsWith(repoBase + '/')) {
                  return repoBase + u;
                }
              }
              return u;
            };

            // 1. Intercept Image src
            var origSrcDesc = Object.getOwnPropertyDescriptor(Image.prototype, 'src');
            if (origSrcDesc && origSrcDesc.set) {
              Object.defineProperty(Image.prototype, 'src', {
                set: function(val) { origSrcDesc.set.call(this, fixUrl(val)); },
                get: origSrcDesc.get
              });
            }

            // 2. Intercept HTMLSourceElement src (Dành riêng cho <source> trong video/audio)
            if (window.HTMLSourceElement) {
              var origSourceSrcDesc = Object.getOwnPropertyDescriptor(HTMLSourceElement.prototype, 'src');
              if (origSourceSrcDesc && origSourceSrcDesc.set) {
                Object.defineProperty(HTMLSourceElement.prototype, 'src', {
                  set: function(val) { origSourceSrcDesc.set.call(this, fixUrl(val)); },
                  get: origSourceSrcDesc.get
                });
              }
            }

            // 3. Intercept HTMLVideoElement src & poster
            if (window.HTMLVideoElement) {
              var origVideoSrcDesc = Object.getOwnPropertyDescriptor(HTMLVideoElement.prototype, 'src');
              if (origVideoSrcDesc && origVideoSrcDesc.set) {
                Object.defineProperty(HTMLVideoElement.prototype, 'src', {
                  set: function(val) { origVideoSrcDesc.set.call(this, fixUrl(val)); },
                  get: origVideoSrcDesc.get
                });
              }
              var origVideoPosterDesc = Object.getOwnPropertyDescriptor(HTMLVideoElement.prototype, 'poster');
              if (origVideoPosterDesc && origVideoPosterDesc.set) {
                Object.defineProperty(HTMLVideoElement.prototype, 'poster', {
                  set: function(val) { origVideoPosterDesc.set.call(this, fixUrl(val)); },
                  get: origVideoPosterDesc.get
                });
              }
            }

            // 4. Intercept fetch
            var origFetch = window.fetch;
            if (origFetch) {
              window.fetch = function(input, init) {
                if (typeof input === 'string') input = fixUrl(input);
                return origFetch.call(this, input, init);
              };
            }

            // 5. Global error listener phục hồi media
            window.addEventListener('error', function(e) {
              var el = e.target;
              if (el && (el.tagName === 'IMG' || el.tagName === 'VIDEO' || el.tagName === 'SOURCE') && el.src) {
                try {
                  var urlObj = new URL(el.src);
                  if ((urlObj.pathname.startsWith('/images/') || urlObj.pathname.startsWith('/assets/') || urlObj.pathname.startsWith('/videos/')) && !urlObj.pathname.startsWith(repoBase + '/')) {
                    el.src = repoBase + urlObj.pathname + urlObj.search;
                  }
                } catch(err) {}
              }
            }, true);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-eco-gray-50 text-eco-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
