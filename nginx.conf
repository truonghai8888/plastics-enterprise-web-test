server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    port_in_redirect off;
    absolute_redirect off;

    # Gzip compression để load nhanh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Trả trực tiếp công cụ 3D Studio cho /tu-thiet-ke-vach không cần redirect
    location = /tu-thiet-ke-vach {
        try_files /tu-thiet-ke-vach/index.html /index.html;
    }

    # Cấu hình Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
