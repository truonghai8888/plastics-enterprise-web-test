<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #f0f0f0; font-family: sans-serif; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
  .card { background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; padding-bottom: 8px; }
  .card img { width: 100%; aspect-ratio: 12/7; object-fit: cover; display: block; border-bottom: 1px solid #eee; }
  .card .title { padding: 6px 8px; font-size: 13px; font-weight: bold; }
</style>
</head>
<body>
<h2>Preview all MAU THUMB</h2>
<div class="grid">
  <div class="card"><img src="/assets/img/vach/mau/trong.webp"><div class="title">trong - Vách trống</div></div>
  <div class="card"><img src="/assets/img/vach/mau/tu.webp"><div class="title">tu - Vách tivi + tủ</div></div>
  <div class="card"><img src="/assets/img/vach/mau/noi.webp"><div class="title">noi - Khối nổi + LED</div></div>
  <div class="card"><img src="/assets/img/vach/mau/nep.webp"><div class="title">nep - Mảng chia nẹp</div></div>
  <div class="card"><img src="/assets/img/vach/mau/lam.webp"><div class="title">lam - Dải lam sóng</div></div>
  <div class="card"><img src="/assets/img/vach/mau/hoc.webp"><div class="title">hoc - Hốc TV lõm</div></div>
  <div class="card"><img src="/assets/img/vach/mau/hai.webp"><div class="title">hai - Hai họ vật liệu</div></div>
  <div class="card"><img src="/assets/img/vach/mau/khe.webp"><div class="title">khe - Một khe sáng</div></div>
  <div class="card"><img src="/assets/img/vach/mau/bogoc.webp"><div class="title">bogoc - Khối nổi bo góc</div></div>
</div>
</body>
</html>
