<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Nhựa AMC - Đang chuyển hướng...</title>
    <script type="text/javascript">
      // SPA GitHub Pages Redirect Handler (Hỗ trợ truy cập trực tiếp mọi link con trên cả User site & Project site)
      var knownRoutes = [
        'tu-thiet-ke-vach', 'san-pham-chinh', 'thu-vien-ma-mau', 'bang-gia',
        'tinh-chi-phi', 'cong-trinh', 'tai-catalogue', 'huong-dan-thi-cong',
        'tin-tuc', 'hoi-dap', 'gioi-thieu', 'chung-chi-chung-nhan',
        'chinh-sach-bao-hanh', 'lien-he', 'nhan-mau', 'san-pham',
        'chinh-sach-bao-mat', 'dieu-khoan', 'nha-phan-phoi', 'tam-than-tre-17mm'
      ];
      var l = window.location;
      var segs = l.pathname.split('/').filter(Boolean);
      var pathSegmentsToKeep = 0;
      // Nếu phân đoạn đầu tiên KHÔNG phải là một route đã biết, thì đó là tên repository (Project site: /repo-name/...)
      if (segs.length > 0 && knownRoutes.indexOf(segs[0]) === -1) {
        pathSegmentsToKeep = 1;
      }

      var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' +
        routePath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
